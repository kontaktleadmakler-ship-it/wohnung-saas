{% extends 'base.html' %}
{% block title %}WohnungsRadar — Login{% endblock %}
{% block content %}
<div class="head"><div><div class="eyebrow">WOHNUNGSRADAR</div><h1>Dashboard Login</h1></div></div>
<form method="post" class="form" style="max-width:420px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{next}}">
  <label>Passwort<input name="password" type="password" autocomplete="current-password" required autofocus></label>
  <button>ANMELDEN</button>
</form>
{% endblock %}
