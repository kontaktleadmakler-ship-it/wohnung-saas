# Production architecture: stateless Flask web + independent Render cron scanner.
# Both services share MongoDB and the same renewable MongoDB scan lease.
services:
  - type: web
    name: wohnung-saas-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: wohnung_saas
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_AUTH_REQUIRED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: ENABLE_AUTO_SCAN
        value: "false"
      - key: DASHBOARD_LIMIT
        value: "300"
      - key: MIN_NOTIFY_SCORE
        value: "75"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: "15000"
      - key: MONGO_TLS_INSECURE
        value: "false"
      - key: SCAN_LOCK_LEASE_SECONDS
        value: "180"
      - key: SCAN_LOCK_RENEW_INTERVAL_SECONDS
        value: "30"
      - key: LEGACY_SCAN_LOCK_STALE_SECONDS
        value: "120"
      - key: SCAN_PROCESS_TIMEOUT_SECONDS
        value: "1800"
      - key: SCRAPE_MAX_PAGES
        value: "3"
      - key: SCRAPE_RETRIES
        value: "3"
      - key: SCRAPE_PAGE_TIMEOUT_MS
        value: "30000"
      - key: SCRAPE_WAIT_MS
        value: "1800"
      - key: SCRAPE_DELAY_MIN
        value: "1.0"
      - key: SCRAPE_DELAY_MAX
        value: "2.0"
      - key: LISTING_RETENTION_DAYS
        value: "60"
      - key: SCAN_RETENTION_DAYS
        value: "90"

  - type: cron
    name: wohnung-saas-scanner
    env: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/10 * * * *"
    dockerCommand: python scraper.py --once
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: wohnung_saas
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: POLL_INTERVAL_SECONDS
        value: "600"
      - key: MIN_NOTIFY_SCORE
        value: "75"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: MONGO_SOCKET_TIMEOUT_MS
        value: "15000"
      - key: MONGO_TLS_INSECURE
        value: "false"
      - key: SCAN_LOCK_LEASE_SECONDS
        value: "180"
      - key: SCAN_LOCK_RENEW_INTERVAL_SECONDS
        value: "30"
      - key: LEGACY_SCAN_LOCK_STALE_SECONDS
        value: "120"
      - key: SCRAPE_MAX_PAGES
        value: "3"
      - key: SCRAPE_RETRIES
        value: "3"
      - key: SCRAPE_PAGE_TIMEOUT_MS
        value: "30000"
      - key: SCRAPE_WAIT_MS
        value: "1800"
      - key: SCRAPE_DELAY_MIN
        value: "1.0"
      - key: SCRAPE_DELAY_MAX
        value: "2.0"
      - key: LISTING_RETENTION_DAYS
        value: "60"
      - key: SCAN_RETENTION_DAYS
        value: "90"
