services:
  - type: web
    name: wohnung-saas-web
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DASHBOARD_LIMIT
        value: "300"
      - key: LOG_LEVEL
        value: "INFO"

  - type: worker
    name: wohnung-saas-worker
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python scraper.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: MIN_NOTIFY_SCORE
        value: "75"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: MAX_CONCURRENT_SCRAPERS
        value: "1"
      - key: SCRAPE_MAX_PAGES
        value: "3"
      - key: LOG_LEVEL
        value: "INFO"
