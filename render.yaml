services:
  - type: web
    name: wohnung-saas-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false

  - type: worker
    name: wohnung-saas-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scraper.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SEARCH_URLS
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "180"
      - key: MIN_NOTIFY_SCORE
        value: "60"
