# Ein einzelner Service:
#  - wohnung-saas-web: Dashboard UND Scanning in einem Prozess. Der Scan
#    läuft als Hintergrund-Thread im Web-Prozess (ENABLE_AUTO_SCAN=true),
#    kein separater Cron-Service nötig. Damit der Prozess nicht wegen
#    Inaktivität einschläft und der Hintergrund-Scan dadurch pausiert,
#    lohnt sich ein externer Keep-Alive-Ping (z. B. UptimeRobot).
services:
  - type: web
    name: wohnung-saas-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: DASHBOARD_LIMIT
        value: "300"
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      # Kein separater Cron-Service mehr -> der Web-Prozess scannt selbst
      # per Hintergrund-Thread. Deshalb hier "true".
      - key: ENABLE_AUTO_SCAN
        value: "true"
      - key: INITIAL_SCAN_DELAY_SECONDS
        value: "30"
      - key: MIN_NOTIFY_SCORE
        value: "75"
      - key: SCRAPE_MAX_PAGES
        value: "3"
      - key: MAX_CANDIDATES_PER_SOURCE
        value: "0"
      - key: SCRAPE_DELAY_MIN
        value: "0.8"
      - key: SCRAPE_DELAY_MAX
        value: "1.8"
      - key: SCRAPE_WAIT_MS
        value: "1800"
      - key: SCRAPE_PAGE_TIMEOUT_MS
        value: "30000"
      - key: SCRAPE_RETRIES
        value: "3"
      - key: SCRAPE_BACKOFF_BASE
        value: "1.5"
      - key: LISTING_RETENTION_DAYS
        value: "60"
      - key: LOG_LEVEL
        value: "INFO"
      # PYTHONUNBUFFERED=1 zusammen mit dem Flushing-Handler in
      # logging_setup.py, damit bei einem harten Kill (OOM,
      # Health-Check-Timeout) keine Log-Zeilen im Puffer verloren gehen.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
