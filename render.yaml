# Nur noch EIN Service: der Scan läuft als periodischer Subprozess
# (`python scraper.py --once`) innerhalb des Web-Prozesses (siehe
# app.py::_background_scanner). Der frühere separate `wohnung-saas-worker`
# Service ist entfallen - falls er in Render noch existiert, kann er
# gelöscht werden, sonst läuft der Scan doppelt (zwei Prozesse teilen sich
# zwar denselben Advisory-Lock, verbrauchen aber unnötig einen zweiten
# Free-Tier-Slot).
services:
  - type: web
    name: wohnung-saas-web
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DASHBOARD_LIMIT
        value: "300"
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: MIN_NOTIFY_SCORE
        value: "75"
      - key: MAX_CONCURRENT_SCRAPERS
        value: "1"
      - key: SCRAPE_MAX_PAGES
        value: "3"
      - key: SCRAPE_DELAY_MIN
        value: "0.8"
      - key: SCRAPE_DELAY_MAX
        value: "1.8"
      - key: SCRAPE_WAIT_MS
        value: "1800"
      - key: SCRAPE_PAGE_TIMEOUT_MS
        value: "30000"
      - key: SCRAPE_RETRIES
        value: "3"
      - key: SCRAPE_BACKOFF_BASE
        value: "1.5"
      - key: LOG_LEVEL
        value: "INFO"
      # PYTHONUNBUFFERED=1 zusammen mit dem Flushing-Handler in
      # logging_setup.py, damit bei einem harten Kill (OOM,
      # Health-Check-Timeout) keine Log-Zeilen im Puffer verloren gehen.
      - key: PYTHONUNBUFFERED
        value: "1"
      # OOM-Test: 512-MB-Free-Instanz + Chromium kann mit allen 7 Quellen
      # knapp werden (Subprozess endet mit exit=-9/Killed). Testweise auf
      # nur kleinanzeigen reduziert; nach Bestätigung, dass es ohne -9
      # durchläuft, schrittweise Quellen wieder hinzufügen oder ganz
      # entfernen (dann laufen wieder alle Profil-Quellen) bzw. auf den
      # Starter-Plan wechseln, wenn alle 7 Quellen gebraucht werden.
      - key: EMBEDDED_WORKER_SOURCES
        value: "kleinanzeigen"
